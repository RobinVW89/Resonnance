<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Nouveaux membres 2026</title>
  <desc id="desc">Visuel premium avec photos de Damien Vaddé, Camille Guilmineau et Justine Duval.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102a1f"/>
      <stop offset="55%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="50%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b1f17" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clipLeft"><rect x="120" y="215" width="360" height="430" rx="24"/></clipPath>
    <clipPath id="clipCenter"><rect x="520" y="215" width="360" height="430" rx="24"/></clipPath>
    <clipPath id="clipRight"><rect x="920" y="215" width="360" height="430" rx="24"/></clipPath>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="180" cy="95" r="160" fill="#74c69d" opacity="0.12"/>
  <circle cx="1240" cy="665" r="220" fill="#95d5b2" opacity="0.10"/>

  <text x="700" y="86" text-anchor="middle" fill="#e9f5ef" font-family="Montserrat, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="6">RÉSONANCE</text>
  <text x="700" y="140" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="56" font-weight="800">Nouveaux membres 2026</text>
  <rect x="490" y="162" width="420" height="6" rx="3" fill="url(#goldLine)"/>

  <g filter="url(#cardShadow)">
    <rect x="120" y="215" width="360" height="430" rx="24" fill="#173a2c" stroke="#74c69d" stroke-opacity="0.35"/>
    <rect x="520" y="215" width="360" height="430" rx="24" fill="#173a2c" stroke="#74c69d" stroke-opacity="0.35"/>
    <rect x="920" y="215" width="360" height="430" rx="24" fill="#173a2c" stroke="#74c69d" stroke-opacity="0.35"/>
  </g>

  <image href="new-members/vadde-damien.jpeg" x="120" y="215" width="360" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipLeft)"/>
  <image href="new-members/guilmineau-camille.png" x="520" y="215" width="360" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipCenter)"/>
  <image href="new-members/duval-justine.jpeg" x="920" y="215" width="360" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipRight)"/>

  <rect x="120" y="215" width="360" height="430" rx="24" fill="url(#overlay)"/>
  <rect x="520" y="215" width="360" height="430" rx="24" fill="url(#overlay)"/>
  <rect x="920" y="215" width="360" height="430" rx="24" fill="url(#overlay)"/>

  <text x="300" y="585" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="700">Damien Vaddé</text>
  <text x="300" y="618" text-anchor="middle" fill="#cfeedd" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="500">L'immobilier à votre image</text>

  <text x="700" y="585" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="700">Camille Guilmineau</text>
  <text x="700" y="618" text-anchor="middle" fill="#cfeedd" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="500">Direction artistique &amp; (re)branding</text>

  <text x="1100" y="585" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="700">Justine Duval</text>
  <text x="1100" y="618" text-anchor="middle" fill="#cfeedd" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="500">Agrafes Viti 4.0</text>
</svg>
